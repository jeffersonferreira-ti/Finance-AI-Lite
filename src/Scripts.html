<script>
(() => {
  const STORAGE_KEY = 'financeAiLiteChatHistoryV2';
  const SESSION_KEY = 'financeAiWebSessionId';
  const MAX_HISTORY = 60;
  const state = { busy: false, backendReady: false, sessionId: null, history: [] };

  const $ = id => document.getElementById(id);
  const chat = $('chat');
  const form = $('message-form');
  const input = $('message-input');
  const sendButton = $('send-button');
  const backendStatus = $('backend-status');
  const clearChatButton = $('clear-chat');
  const examples = $('examples');
  const proactive = $('proactive-insights');
  const proactiveList = $('proactive-insights-list');
  const proactiveMeta = $('proactive-insights-meta');
  const refreshInsightsButton = $('refresh-insights');

  const money = value => new Intl.NumberFormat('pt-BR', {
    style: 'currency', currency: 'BRL'
  }).format(Number(value || 0));

  function createRequestId() {
    return window.crypto?.randomUUID?.() || `web-${Date.now()}-${Math.random().toString(36).slice(2)}`;
  }

  function getSessionId() {
    try {
      const value = sessionStorage.getItem(SESSION_KEY);
      if (value) return value;
      const created = createRequestId();
      sessionStorage.setItem(SESSION_KEY, created);
      return created;
    } catch (_) {
      return createRequestId();
    }
  }

  function loadHistory() {
    try {
      const value = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      state.history = Array.isArray(value) ? value.slice(-MAX_HISTORY) : [];
    } catch (_) {
      state.history = [];
    }
  }

  function saveHistory() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state.history.slice(-MAX_HISTORY)));
    } catch (_) {}
  }

  function pushHistory(entry) {
    state.history.push(entry);
    if (state.history.length > MAX_HISTORY) state.history = state.history.slice(-MAX_HISTORY);
    saveHistory();
  }

  function setBackendStatus(text, mode = 'loading') {
    backendStatus.textContent = text;
    backendStatus.className = `status-badge status-${mode}`;
  }

  function setBusy(value) {
    state.busy = value;
    sendButton.disabled = value || !state.backendReady;
    input.disabled = value || !state.backendReady;
    document.querySelectorAll('.quick-action,.advanced-shortcut,.example-chip')
      .forEach(button => button.disabled = value || !state.backendReady);
  }

  function scrollBottom() {
    requestAnimationFrame(() => { chat.scrollTop = chat.scrollHeight; });
  }

  function createAdvancedDetails(response) {
    if (!response?.consultaAvancada || !response?.dados) return null;
    const details = document.createElement('details');
    details.className = 'advanced-result';
    details.open = true;

    const summary = document.createElement('summary');
    summary.textContent = response.ux?.titulo || 'Detalhes da consulta';
    details.appendChild(summary);

    const body = document.createElement('div');
    body.className = 'advanced-result-body';

    const meta = document.createElement('div');
    meta.className = 'advanced-meta';
    const chips = [];
    if (response.ux?.periodo) chips.push(['Período', response.ux.periodo]);
    if (response.ux?.periodoAnterior) chips.push(['Anterior', response.ux.periodoAnterior]);
    if (response.ux?.periodoAtual) chips.push(['Atual', response.ux.periodoAtual]);
    (response.ux?.filtros || []).forEach(item => chips.push([item.rotulo, item.valor]));
    chips.forEach(([label, value]) => {
      const chip = document.createElement('span');
      chip.className = 'advanced-filter-chip';
      chip.textContent = `${label}: ${value}`;
      meta.appendChild(chip);
    });
    if (meta.childNodes.length) body.appendChild(meta);

    const data = response.dados;
    const type = response.consultaAvancada;

    if (type === 'Busca') {
      const grid = document.createElement('div');
      grid.className = 'advanced-kpis';
      const metrics = [
        ['Encontrados', data.totalSemLimite ?? data.total ?? 0],
        ['Despesas', money(data.resumo?.despesas)],
        ['Receitas', money(data.resumo?.receitas)],
        ['Soma', money(data.resumo?.valorTotal)]
      ];
      metrics.forEach(([label, value]) => {
        const card = document.createElement('div');
        card.className = 'advanced-kpi';
        card.innerHTML = `<span>${label}</span><strong>${value}</strong>`;
        grid.appendChild(card);
      });
      body.appendChild(grid);

      const rows = Array.isArray(data.resultados) ? data.resultados.slice(0, 10) : [];
      if (!rows.length) {
        const empty = document.createElement('div');
        empty.className = 'advanced-empty-state';
        empty.textContent = 'Nenhum resultado para estes filtros.';
        body.appendChild(empty);
      } else {
        const list = document.createElement('div');
        list.className = 'advanced-list';
        rows.forEach(item => {
          const row = document.createElement('div');
          row.className = 'advanced-transaction-row';
          const desc = document.createElement('div');
          desc.innerHTML = `<strong>${item.descricao || 'Lançamento'}</strong><span>${[item.categoria, item.conta || item.cartao].filter(Boolean).join(' · ')}</span>`;
          const value = document.createElement('strong');
          value.textContent = money(item.valor);
          row.append(desc, value);
          list.appendChild(row);
        });
        body.appendChild(list);
      }
    } else {
      const ranking = Array.isArray(data.ranking) ? data.ranking : [];
      if (ranking.length) {
        const list = document.createElement('div');
        list.className = 'advanced-ranking';
        ranking.slice(0, 10).forEach(item => {
          const row = document.createElement('div');
          row.className = 'advanced-ranking-row';
          row.innerHTML = `<span>#${item.posicao || ''} ${item.rotulo || item.descricao || 'Item'}</span><strong>${item.valor !== undefined ? money(item.valor) : item.despesas !== undefined ? money(item.despesas) : item.delta !== undefined ? money(item.delta) : ''}</strong>`;
          list.appendChild(row);
        });
        body.appendChild(list);
      } else if (data.comparacao) {
        const grid = document.createElement('div');
        grid.className = 'advanced-comparison-grid';
        ['despesas', 'receitas', 'resultado'].forEach(key => {
          const item = data.comparacao[key];
          if (!item) return;
          const card = document.createElement('div');
          card.className = 'advanced-comparison-card';
          card.innerHTML = `<span>${key}</span><strong>${money(item.anterior)} → ${money(item.atual)}</strong><small>${money(item.delta)}</small>`;
          grid.appendChild(card);
        });
        body.appendChild(grid);
      }
    }

    details.appendChild(body);
    return details;
  }

  function addMessage(role, text, options = {}) {
    const row = document.createElement('div');
    row.className = `message-row ${role} dynamic-message`;
    const bubble = document.createElement('div');
    bubble.className = 'message-bubble';
    const head = document.createElement('div');
    head.className = 'message-head';
    head.textContent = role === 'user' ? 'Você' : 'Finance AI';
    const body = document.createElement('div');
    body.className = 'message-text';
    body.textContent = String(text || '');
    bubble.append(head, body);
    const advanced = createAdvancedDetails(options.response);
    if (advanced) bubble.appendChild(advanced);
    row.appendChild(bubble);
    chat.appendChild(row);
    scrollBottom();

    if (options.persist !== false) {
      pushHistory({ role, text: String(text || ''), response: options.response || null });
    }
  }

  function restoreHistory() {
    state.history.forEach(item => addMessage(item.role, item.text, {
      response: item.response || null,
      persist: false
    }));
    if (state.history.length) examples.hidden = true;
  }

  function handleResponse(response) {
    setBusy(false);
    const message = response?.mensagem || response?.message || 'Operação concluída.';
    addMessage('assistant', message, { response });
  }

  function handleError(error) {
    setBusy(false);
    addMessage('assistant', error?.message || String(error || 'Falha de comunicação.'));
  }

  function sendMessage(command) {
    const text = String(command || input.value || '').trim();
    if (!text || state.busy || !state.backendReady) return;
    examples.hidden = true;
    addMessage('user', text);
    input.value = '';
    setBusy(true);
    google.script.run
      .withSuccessHandler(handleResponse)
      .withFailureHandler(handleError)
      .processarMensagemWeb(text, createRequestId(), state.sessionId);
  }

  function renderProactive(payload) {
    if (!proactive || !proactiveList) return;
    proactiveList.replaceChildren();
    const items = Array.isArray(payload?.top3) ? payload.top3 : [];
    items.forEach(item => {
      const card = document.createElement('article');
      card.className = 'proactive-card';
      card.innerHTML = `<strong>${item.titulo || 'Insight financeiro'}</strong><p>${item.evidencia || ''}</p><small>${item.acao ? 'Ação: ' + item.acao : ''}</small>`;
      proactiveList.appendChild(card);
    });
    proactiveMeta.textContent = [payload?.statusFinanceiro, payload?.competencia].filter(Boolean).join(' · ');
    proactive.hidden = !items.length;
  }

  function loadProactive() {
    if (!state.backendReady || !proactive) return;
    google.script.run
      .withSuccessHandler(renderProactive)
      .withFailureHandler(() => {})
      .obterInsightsProativosWebV33();
  }

  function loadBootstrap() {
    setBackendStatus('Conectando...', 'loading');
    google.script.run
      .withSuccessHandler(bootstrap => {
        state.backendReady = !!bootstrap?.backend?.pronto;
        setBackendStatus(state.backendReady ? 'Backend conectado' : 'Backend pendente', state.backendReady ? 'ready' : 'error');
        setBusy(false);
        if (state.backendReady) loadProactive();
      })
      .withFailureHandler(error => {
        state.backendReady = false;
        setBackendStatus('Falha no backend', 'error');
        setBusy(false);
        handleError(error);
      })
      .obterBootstrapWebApp();
  }

  form.addEventListener('submit', event => { event.preventDefault(); sendMessage(); });
  input.addEventListener('keydown', event => {
    if (event.key === 'Enter' && !event.shiftKey) {
      event.preventDefault();
      sendMessage();
    }
  });

  document.querySelectorAll('.quick-action,.advanced-shortcut').forEach(button => {
    button.addEventListener('click', () => sendMessage(button.dataset.command));
  });
  document.querySelectorAll('.example-chip').forEach(button => {
    button.addEventListener('click', () => {
      input.value = button.dataset.example || '';
      input.focus();
    });
  });

  clearChatButton.addEventListener('click', () => {
    if (!confirm('Limpar o histórico deste navegador?')) return;
    state.history = [];
    try { localStorage.removeItem(STORAGE_KEY); } catch (_) {}
    chat.querySelectorAll('.dynamic-message').forEach(node => node.remove());
    examples.hidden = false;
  });

  refreshInsightsButton?.addEventListener('click', loadProactive);

  state.sessionId = getSessionId();
  loadHistory();
  restoreHistory();
  setBusy(false);
  loadBootstrap();
})();
</script>
