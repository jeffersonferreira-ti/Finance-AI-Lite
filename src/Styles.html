<style>
  :root {
    color-scheme: light;
    --bg: #f5f7fb;
    --surface: #ffffff;
    --surface-soft: #eef2f7;
    --text: #172033;
    --muted: #6b7484;
    --line: #dfe5ee;
    --accent: #1f6feb;
    --accent-strong: #1558bd;
    --success: #16794b;
    --success-bg: #eaf7f0;
    --warning: #9a6700;
    --warning-bg: #fff7df;
    --danger: #b42318;
    --danger-bg: #fff0ee;
    --query-bg: #edf4ff;
    --query-text: #275ea8;
    --shadow: 0 12px 32px rgba(23, 32, 51, 0.08);
    --radius: 18px;
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family:
      Inter,
      ui-sans-serif,
      system-ui,
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      sans-serif;
  }

  body {
    min-height: 100dvh;
  }

  button,
  textarea {
    font: inherit;
  }

  button {
    -webkit-tap-highlight-color: transparent;
  }

  .app-shell {
    width: min(100%, 860px);
    min-height: 100dvh;
    margin: 0 auto;
    background: var(--surface);
    display: flex;
    flex-direction: column;
    box-shadow: var(--shadow);
  }

  .topbar {
    position: sticky;
    top: 0;
    z-index: 20;
    min-height: 76px;
    padding:
      calc(14px + env(safe-area-inset-top))
      18px
      14px;
    background: rgba(255, 255, 255, 0.96);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
  }

  .brand {
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 11px;
  }

  .brand-mark {
    width: 42px;
    height: 42px;
    flex: 0 0 42px;
    border-radius: 13px;
    background: var(--text);
    color: #fff;
    display: grid;
    place-items: center;
    font-size: 20px;
    font-weight: 750;
  }

  .brand-copy {
    min-width: 0;
  }

  .brand h1 {
    margin: 0;
    font-size: 17px;
    line-height: 1.2;
  }

  .brand p {
    margin: 3px 0 0;
    color: var(--muted);
    font-size: 12px;
  }

  .topbar-actions {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .clear-chat {
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--surface);
    color: var(--muted);
    padding: 7px 10px;
    cursor: pointer;
    font-size: 11px;
    font-weight: 700;
  }

  .clear-chat:hover {
    background: var(--surface-soft);
    color: var(--text);
  }

  .status-badge {
    flex: 0 0 auto;
    border-radius: 999px;
    padding: 7px 10px;
    font-size: 11px;
    font-weight: 700;
    white-space: nowrap;
  }

  .status-loading {
    background: #eef2f7;
    color: var(--muted);
  }

  .status-ready {
    background: var(--success-bg);
    color: var(--success);
  }

  .status-error {
    background: var(--danger-bg);
    color: var(--danger);
  }

  .quick-actions {
    position: sticky;
    top: 76px;
    z-index: 15;
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 10px 14px;
    background: rgba(255, 255, 255, 0.96);
    border-bottom: 1px solid var(--line);
    scrollbar-width: none;
  }

  .quick-actions::-webkit-scrollbar {
    display: none;
  }

  .quick-action {
    flex: 0 0 auto;
    min-height: 34px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--surface);
    color: var(--text);
    padding: 0 12px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 650;
  }

  .quick-action:hover:not(:disabled) {
    background: var(--surface-soft);
  }

  .quick-action:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }

  .chat {
    flex: 1;
    overflow-y: auto;
    padding: 22px 18px 28px;
    scroll-behavior: smooth;
  }

  .message-row {
    display: flex;
    margin-bottom: 14px;
  }

  .message-row.assistant {
    justify-content: flex-start;
  }

  .message-row.user {
    justify-content: flex-end;
  }

  .message-bubble {
    width: fit-content;
    max-width: min(82%, 650px);
    border-radius: var(--radius);
    padding: 12px 14px;
    line-height: 1.45;
    word-break: break-word;
  }

  .assistant .message-bubble {
    background: var(--surface-soft);
    border-bottom-left-radius: 6px;
  }

  .user .message-bubble {
    background: var(--text);
    color: #fff;
    border-bottom-right-radius: 6px;
  }

  .message-head {
    min-height: 17px;
    margin-bottom: 5px;
    display: flex;
    align-items: center;
    gap: 7px;
  }

  .message-label {
    font-size: 11px;
    font-weight: 750;
    opacity: 0.7;
  }

  .response-tag {
    display: inline-flex;
    align-items: center;
    min-height: 20px;
    border-radius: 999px;
    padding: 2px 7px;
    font-size: 10px;
    font-weight: 750;
  }

  .tag-consulta {
    background: var(--query-bg);
    color: var(--query-text);
  }

  .tag-acao {
    background: var(--success-bg);
    color: var(--success);
  }

  .tag-confirmacao {
    background: var(--warning-bg);
    color: var(--warning);
  }

  .tag-atencao {
    background: var(--danger-bg);
    color: var(--danger);
  }

  .message-text {
    font-size: 14px;
    white-space: pre-wrap;
  }

  .structured-response {
    display: grid;
    gap: 7px;
  }

  .structured-item {
    padding: 8px 10px;
    border-radius: 11px;
    background: rgba(255, 255, 255, 0.72);
  }

  .message-row.error .message-bubble {
    background: var(--danger-bg);
    color: var(--danger);
  }

  .message-row.loading .message-bubble {
    color: var(--muted);
  }

  .typing-dots {
    display: inline-flex;
    gap: 4px;
    align-items: center;
  }

  .typing-dots span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: currentColor;
    animation: pulse 1s infinite ease-in-out;
  }

  .typing-dots span:nth-child(2) {
    animation-delay: 0.12s;
  }

  .typing-dots span:nth-child(3) {
    animation-delay: 0.24s;
  }

  @keyframes pulse {
    0%,
    100% {
      opacity: 0.25;
      transform: translateY(0);
    }

    50% {
      opacity: 1;
      transform: translateY(-2px);
    }
  }

  .confirmation-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 11px;
  }

  .confirmation-button {
    min-height: 36px;
    border-radius: 11px;
    padding: 0 13px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 750;
  }

  .confirmation-button.confirm {
    border: 0;
    background: var(--accent);
    color: #fff;
  }

  .confirmation-button.cancel {
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--text);
  }

  .confirmation-button:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }

  .examples {
    margin-top: 18px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }

  .examples > span {
    color: var(--muted);
    font-size: 12px;
    margin-right: 2px;
  }

  .example-chip {
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--text);
    border-radius: 999px;
    padding: 8px 11px;
    cursor: pointer;
    font-size: 12px;
  }

  .example-chip:hover {
    background: var(--surface-soft);
  }

  .composer-shell {
    position: sticky;
    bottom: 0;
    z-index: 20;
    padding:
      12px
      14px
      calc(12px + env(safe-area-inset-bottom));
    background: rgba(255, 255, 255, 0.97);
    backdrop-filter: blur(12px);
    border-top: 1px solid var(--line);
  }

  .composer {
    display: flex;
    align-items: flex-end;
    gap: 9px;
    border: 1px solid var(--line);
    background: var(--surface);
    border-radius: 18px;
    padding: 8px;
    box-shadow: 0 4px 18px rgba(23, 32, 51, 0.05);
  }

  .composer:focus-within {
    border-color: #aac8f6;
    box-shadow: 0 0 0 3px rgba(31, 111, 235, 0.09);
  }

  #message-input {
    width: 100%;
    min-height: 42px;
    max-height: 150px;
    resize: none;
    border: 0;
    outline: 0;
    background: transparent;
    color: var(--text);
    padding: 10px 8px;
    line-height: 1.4;
  }

  #message-input::placeholder {
    color: #98a1b0;
  }

  .send-button {
    min-width: 76px;
    min-height: 42px;
    border: 0;
    border-radius: 12px;
    padding: 0 14px;
    background: var(--accent);
    color: #fff;
    font-weight: 750;
    cursor: pointer;
  }

  .send-button:hover:not(:disabled) {
    background: var(--accent-strong);
  }

  .send-button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .composer-meta {
    margin-top: 7px;
    padding: 0 4px;
    display: flex;
    justify-content: space-between;
    gap: 16px;
    color: var(--muted);
    font-size: 10px;
  }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  @media (max-width: 640px) {
    .app-shell {
      width: 100%;
      box-shadow: none;
    }

    .topbar {
      min-height: 68px;
      padding-left: 12px;
      padding-right: 12px;
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      flex-basis: 38px;
      border-radius: 11px;
    }

    .brand h1 {
      font-size: 15px;
    }

    .brand p {
      display: none;
    }

    .clear-chat {
      padding-left: 9px;
      padding-right: 9px;
    }

    .status-badge {
      padding-left: 8px;
      padding-right: 8px;
    }

    .quick-actions {
      top: 68px;
      padding-left: 10px;
      padding-right: 10px;
    }

    .chat {
      padding: 18px 12px 24px;
    }

    .message-bubble {
      max-width: 90%;
    }

    .composer-shell {
      padding-left: 10px;
      padding-right: 10px;
    }

    .composer-meta {
      display: none;
    }

    .send-button {
      min-width: 68px;
      padding: 0 12px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .chat {
      scroll-behavior: auto;
    }

    .typing-dots span {
      animation: none;
    }
  }
</style>
